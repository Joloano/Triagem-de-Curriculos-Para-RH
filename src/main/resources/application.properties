spring.application.name=triagem

# Banco de dados (container Docker triagem-db, porta 5435)
spring.datasource.url=jdbc:postgresql://localhost:5435/triagem
spring.datasource.username=postgres
spring.datasource.password=postgres

# Quem cria as tabelas e o Flyway (resources/db/migration), nao o Hibernate.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Mostra a mensagem das regras de negocio na resposta de erro.
server.error.include-message=always
